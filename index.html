  <!--
    Folio — direction contract.
    THESIS: A civic bureau prospectus for a private document tool. Refuses the
    PDF-site tile grid, and refuses the dark gradient-and-glass SaaS page.
    OWN-WORLD: Near-white plate #f7f7fa, indigo ink #1b1547 that is never pure
    black, hairline structure #e6e7ee, violet #6b5ce7 as the single acting
    colour. Manrope throughout. ONE gradient exists in this product — the
    ribbon — and no other surface is permitted one.
    STORY: The visitor reads what the tool does, sees the two tools as cards,
    and is shown proof it never uploads before being asked to trust it.
    FIRST VIEWPORT: Display headline split two-tone, ink then violet, over a
    reading-width paragraph and two buttons; the ribbon turns through the
    right third. Tool cards sit immediately under the fold line.
    FORM: Civic Bureau — adopted from the declined hand on the user's call;
    seed key 9c84023d, re-roll round 1.
    FINISH: unreviewed and undocumented is unfinished; this build ends with the
    finish review, the verdict, DESIGN.md, and every shipping raster carrying
    its provenance.
  -->
